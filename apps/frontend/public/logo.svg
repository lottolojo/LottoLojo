<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#34e8a8"/>
      <stop offset="100%" stop-color="#08936a"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe87a"/>
      <stop offset="50%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#d4920a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Drop shadow -->
  <circle cx="102" cy="104" r="90" fill="rgba(0,0,0,0.18)"/>
  <!-- Gold outer ring -->
  <circle cx="100" cy="100" r="93" fill="url(#goldRing)"/>
  <!-- Main background -->
  <circle cx="100" cy="100" r="83" fill="url(#bgGrad)"/>
  <!-- Glossy highlight -->
  <ellipse cx="76" cy="63" rx="28" ry="17" fill="rgba(255,255,255,0.22)" transform="rotate(-18,76,63)"/>

  <!-- "LotJo" text centered (tekstzone: x 35-165, y 75-120 — vonkeltjes blijven hierbuiten) -->
  <text x="100" y="118"
    text-anchor="middle"
    font-family="'Arial Black','Arial',sans-serif"
    font-size="44"
    font-weight="900"
    fill="white"
    filter="url(#glow)"
    letter-spacing="-1">LotJo</text>

  <!--
    Vonkeltjes — 8 stuks verspreid buiten de tekstzone.
    Elk heeft een lange cyclus (7-13s) zodat ze weinig frequent zijn.
    keyTimes zorgt dat ze ~15% van de tijd zichtbaar zijn, de rest onzichtbaar.
    Variabele begin-offset zorgt voor gespreide, niet-syncrone verschijning.
    Posities gekozen buiten tekstvlak (x:35-165, y:75-120) maar binnen cirkel r=83.
  -->

  <!-- Vonkel 1 — linksboven (68, 42) — dur 9s begin 0s -->
  <g transform="translate(68,42)" filter="url(#sparkGlow)" opacity="0">
    <circle r="3" fill="white"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0.7;0;0" keyTimes="0;0.04;0.12;0.20;0.28;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </g>

  <!-- Vonkel 2 — rechtsboven (132, 38) — dur 11s begin 2.5s -->
  <g transform="translate(132,38)" filter="url(#sparkGlow)" opacity="0">
    <circle r="2.5" fill="white"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0.6;0;0" keyTimes="0;0.05;0.13;0.22;0.30;1" dur="11s" begin="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- Vonkel 3 — rechts midden-boven (163, 70) — dur 7s begin 1s -->
  <g transform="translate(163,70)" filter="url(#sparkGlow)" opacity="0">
    <circle r="2.2" fill="white"/>
    <line x1="-4.5" y1="0" x2="4.5" y2="0" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0.5;0;0" keyTimes="0;0.06;0.15;0.24;0.32;1" dur="7s" begin="1s" repeatCount="indefinite"/>
  </g>

  <!-- Vonkel 4 — rechtsonder (165, 132) — dur 13s begin 4s -->
  <g transform="translate(165,132)" filter="url(#sparkGlow)" opacity="0">
    <circle r="3" fill="white"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0.8;0;0" keyTimes="0;0.04;0.11;0.20;0.27;1" dur="13s" begin="4s" repeatCount="indefinite"/>
  </g>

  <!-- Vonkel 5 — linksonder midden (38, 128) — dur 10s begin 6.5s -->
  <g transform="translate(38,128)" filter="url(#sparkGlow)" opacity="0">
    <circle r="2.5" fill="white"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0.6;0;0" keyTimes="0;0.05;0.14;0.22;0.30;1" dur="10s" begin="6.5s" repeatCount="indefinite"/>
  </g>

  <!-- Vonkel 6 — ondermidden links (65, 158) — dur 8s begin 3s -->
  <g transform="translate(65,158)" filter="url(#sparkGlow)" opacity="0">
    <circle r="2.8" fill="white"/>
    <line x1="-5.5" y1="0" x2="5.5" y2="0" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0.7;0;0" keyTimes="0;0.05;0.13;0.21;0.29;1" dur="8s" begin="3s" repeatCount="indefinite"/>
  </g>

  <!-- Vonkel 7 — ondermidden rechts (138, 160) — dur 12s begin 7.5s -->
  <g transform="translate(138,160)" filter="url(#sparkGlow)" opacity="0">
    <circle r="2.2" fill="white"/>
    <line x1="-4.5" y1="0" x2="4.5" y2="0" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0.5;0;0" keyTimes="0;0.06;0.15;0.23;0.31;1" dur="12s" begin="7.5s" repeatCount="indefinite"/>
  </g>

  <!-- Vonkel 8 — linksboven schuin (42, 65) — dur 15s begin 5s -->
  <g transform="translate(42,65)" filter="url(#sparkGlow)" opacity="0">
    <circle r="3.2" fill="white"/>
    <line x1="-6.5" y1="0" x2="6.5" y2="0" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="0" y1="-6.5" x2="0" y2="6.5" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0.9;0;0" keyTimes="0;0.04;0.10;0.18;0.25;1" dur="15s" begin="5s" repeatCount="indefinite"/>
  </g>

</svg>
